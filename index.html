<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>המשקלים שלי</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">

<header><h1>🏋️ המשקלים שלי</h1><button id="menuBtn" class="icon" aria-label="תפריט">⋮</button></header>

<nav id="chips" class="chips"></nav>

<button id="addBtn" class="fab" aria-label="הוסף מכשיר">＋</button>

<div id="sheetBg" class="sheet-bg" hidden></div><section id="sheet" class="sheet" hidden></section>

<script src="app.js"></script></body></html>
